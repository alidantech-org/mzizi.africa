patterns:
- pattern: date-day-month-year
  label: Day, month name, year
  means: date
  sequences:
  - - digits:
        min: 1
        max: 2
      as: day
    - group: ordinal-suffix
      optional: true
    - punct: ',.'
      optional: true
    - group: month-names
      as: month
    - punct: ',.'
      optional: true
    - digits:
        min: 4
        max: 4
      as: year
  - - group: month-names
      as: month
    - digits:
        min: 1
        max: 2
      as: day
    - group: ordinal-suffix
      optional: true
    - punct: ','
      optional: true
    - digits:
        min: 4
        max: 4
      as: year
  examples:
  - text: 29th March 2012
    captures:
      day: '29'
      month: March
      year: '2012'
  - text: 3 February, 2025
    captures:
      day: '3'
      month: February
      year: '2025'
  - text: March 29, 2012
    captures:
      month: March
      day: '29'
      year: '2012'
  counterexamples:
  - P.O. Box 34200
  - '2012'
- pattern: date-numeric
  label: A numeric date
  means: date
  sequences:
  - - digits:
        min: 4
        max: 4
      as: year
    - punct: -/.
      as: sep
    - digits:
        min: 1
        max: 2
      as: month
    - punct: -/.
    - digits:
        min: 1
        max: 2
      as: day
  - - digits:
        min: 1
        max: 2
      as: day
    - punct: -/.
      as: sep
    - digits:
        min: 1
        max: 2
      as: month
    - punct: -/.
    - digits:
        min: 2
        max: 4
      as: year
  examples:
  - text: '2022-03-01'
    captures:
      year: '2022'
      month: '03'
      day: '01'
  - text: 01/03/2022
    captures:
      day: '01'
      month: '03'
      year: '2022'
  counterexamples:
  - 29th March 2012
  - 250,000
- pattern: fiscal-year
  label: A financial year
  means: date
  sequences:
  - - group: fiscal-words
      optional: true
    - digits:
        min: 4
        max: 4
      as: start
    - punct: /-
    - digits:
        min: 2
        max: 4
      as: end
  examples:
  - text: FY 2026/27
    captures:
      start: '2026'
      end: '27'
  - text: 2024-2025
    captures:
      start: '2024'
      end: '2025'
  counterexamples:
  - 29th March 2012
