patterns:
- pattern: organisation-name
  label: A company or body name
  means: organisation
  sequences:
  - - words: capitalised
      as: name
      repeat:
        min: 1
        max: 6
    - group: org-suffixes
      as: suffix
  - - group: org-types
      as: type
    - any_of:
      - literal: of
      - literal: for
    - words: capitalised
      as: name
      repeat:
        min: 1
        max: 6
  examples:
  - text: Rawel Holdings Limited
    captures:
      name: Rawel Holdings
      suffix: Limited
  - text: Fornani Co Ltd
    captures:
      name: Fornani Co
      suffix: Ltd
  - text: Ministry of Health
    captures:
      type: Ministry
      name: Health
  counterexamples:
  - Hon. Jane Kamau
- pattern: name-with-abbreviation
  label: A name followed by its abbreviation in brackets
  means: organisation
  sequences:
  - - words: capitalised
      as: name
      repeat:
        min: 1
        max: 8
    - punct: (
    - letters:
        min: 2
        max: 10
        case: upper
      as: abbrev
    - punct: )
  examples:
  - text: The National Alliance (TNA )
    captures:
      name: The National Alliance
      abbrev: TNA
  - text: Orange Democratic Movement (ODM)
    captures:
      name: Orange Democratic Movement
      abbrev: ODM
  counterexamples:
  - Orange Democratic Movement
  - Total (formerly Caltex)
