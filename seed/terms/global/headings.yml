# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/engine/terms.schema.json
code: sys.trm.global.headings
describe: 'How column headings are written: row counters, bracketed units, abbreviation and format markers, footnote marks, and the
  splits they imply.'
languages:
- en
- sw
groups:
- group: row-numbers
  label: Headings that only count rows
  describe: A heading in this group numbers the rows. It names no data column unless a dictionary says so.
  terms:
  - value: s/no
    aliases:
    - s/no.
    - s.no
    - s. no.
    - sno
    - sn
    - s/n
    - sl no
    - sl. no.
    - serial no
    - serial number
    - sr no
    - sr. no.
    kind: concept
  - value: 'no'
    aliases:
    - no.
    - '#'
    - number
    - nambari
    - na.
    kind: concept
  - value: item
    aliases:
    - item no
    - item number
    - ref
    - reference
    - ref no
    - ref. no.
    - ref.
    - lot
    - lot no
    kind: concept
  - value: id
    aliases:
    - index
    - position
    - rank
    kind: concept
- group: bracket-qualifiers
  label: What a bracketed part of a heading usually says
  terms:
  - value: units
    aliases:
    - unit
    - in
    - currency
    - amount in
    kind: pattern-word
  - value: dd/mm/yyyy
    aliases:
    - yyyy-mm-dd
    - date format
    - format
    kind: pattern-word
  - value: abbreviation
    aliases:
    - abbrev
    - abbr
    - acronym
    - short name
    kind: pattern-word
- group: note-markers
  label: Marks that point to a footnote
  terms:
  - value: '*'
    kind: pattern-word
  - value: †
    kind: pattern-word
  - value: ‡
    kind: pattern-word
  - value: §
    kind: pattern-word
  - value: '1'
    kind: pattern-word
  - value: a
    kind: pattern-word
  - value: b
    kind: pattern-word
heading_rules:
- rule: unit-in-brackets
  label: A heading with its unit in brackets
  qualifier_is: unit
  describe: 'Amount (ksh), Value (USD), Budget (KES millions): the base names the column, the bracket gives the unit.'
  sequences:
  - - words: any
      as: base
      repeat:
        min: 1
        max: 6
    - punct: (
    - group: sys.trm.global.money#currency-units
      as: qualifier
    - group: sys.trm.global.money#scale-words
      as: scale
      optional: true
    - punct: )
  examples:
  - text: Amount (USD)
    captures:
      base: Amount
      qualifier: USD
  - text: Budget (KES millions)
    captures:
      base: Budget
      qualifier: KES
      scale: millions
  counterexamples:
  - Amount
  - Party (ABRV)
- rule: abbreviation-in-brackets
  label: A heading marked as holding abbreviations
  qualifier_is: abbreviation
  sequences:
  - - words: any
      as: base
      repeat:
        min: 1
        max: 6
    - punct: (
    - letters:
        min: 2
        max: 8
        case: upper
      as: qualifier
    - punct: )
  examples:
  - text: Party (ABRV)
    captures:
      base: Party
      qualifier: ABRV
  - text: Name of Party (ABBR)
    captures:
      base: Name of Party
      qualifier: ABBR
  counterexamples:
  - Party
  - Amount (ksh)
- rule: format-in-brackets
  label: A heading that states its date format
  qualifier_is: format
  sequences:
  - - words: any
      as: base
      repeat:
        min: 1
        max: 6
    - punct: (
    - letters:
        min: 1
        max: 4
        case: lower
      as: qualifier
    - punct: /-.
    - letters:
        min: 1
        max: 4
        case: lower
      as: qualifier
    - punct: /-.
    - letters:
        min: 1
        max: 4
        case: lower
      as: qualifier
    - punct: )
  examples:
  - text: Date of birth (dd/mm/yyyy)
    captures:
      base: Date of birth
      qualifier: ddmmyyyy
  counterexamples:
  - Date of birth
- rule: note-marker
  label: A heading that points to a footnote
  qualifier_is: note
  sequences:
  - - words: any
      as: base
      repeat:
        min: 1
        max: 6
    - punct: '*†‡§'
      as: qualifier
  examples:
  - text: Total*
    captures:
      base: Total
      qualifier: '*'
  counterexamples:
  - Total
splits:
- split: name-and-abbreviation
  label: A name column that also carries the abbreviation
  heading_rule: abbreviation-in-brackets
  cell_pattern: sys.trm.global.organisations#name-with-abbreviation
  min_share: 0.8
  describe: 'Party (ABRV) with cells like Orange Democratic Movement (ODM) is two columns collapsed into one: the name and its abbreviation.'
  into:
  - from_capture: name
    as: main
  - from_capture: abbrev
    as: qualifier
  examples:
  - text: Orange Democratic Movement (ODM)
    captures:
      name: Orange Democratic Movement
      abbrev: ODM
