patterns:
- pattern: titled-person
  label: A person with a title or office
  means: person
  describe: A form of address or an office before the names, or an office after them. Names alone are not enough to call a cell a person.
  sequences:
  - - group: person-titles
      as: title
    - group: office-titles
      as: office
      optional: true
    - words: capitalised
      as: given
      repeat:
        min: 1
        max: 3
    - words: capitalised
      as: family
  - - group: office-titles
      as: office
    - words: capitalised
      as: given
      repeat:
        min: 1
        max: 3
    - words: capitalised
      as: family
  - - group: person-titles
      as: title
      optional: true
    - words: capitalised
      as: given
      repeat:
        min: 1
        max: 3
    - words: capitalised
      as: family
    - punct: ','
      optional: true
    - group: office-titles
      as: office_after
  examples:
  - text: Hon. Jane Wanjiru Kamau
    captures:
      title: Hon.
      given: Jane Wanjiru
      family: Kamau
  - text: H.E. Governor Anne Waiguru
    captures:
      title: H.E.
      office: Governor
      given: Anne
      family: Waiguru
  - text: Dr. John Kamau, Chairperson
    captures:
      title: Dr.
      given: John
      family: Kamau
      office_after: Chairperson
  counterexamples:
  - P.O. Box 34200
  - KES 1,200
- pattern: member-of-for
  label: An elected seat
  means: role
  sequences:
  - - group: office-titles
      as: office
    - any_of:
      - literal: for
      - literal: of
    - words: capitalised
      as: place
      repeat:
        min: 1
        max: 3
  examples:
  - text: Member of Parliament for Kiambu Town
    captures:
      office: Member of Parliament
      place: Kiambu Town
  - text: Governor of Nairobi
    captures:
      office: Governor
      place: Nairobi
  counterexamples:
  - Jane Kamau
