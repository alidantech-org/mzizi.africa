patterns:
- pattern: po-box
  label: A postal box address
  means: address
  sequences:
  - - group: po-box-words
      as: label
    - digits:
        min: 1
        max: 7
      as: box
    - punct: -,
      optional: true
    - digits:
        min: 4
        max: 5
      as: postcode
      optional: true
    - punct: ','
      optional: true
    - words: capitalised
      as: town
      optional: true
      repeat:
        min: 1
        max: 3
  examples:
  - text: P.O. Box 34200-00100 Nairobi
    captures:
      box: '34200'
      postcode: '00100'
      town: Nairobi
  - text: PO Box 12 Kisumu
    captures:
      box: '12'
      town: Kisumu
  - text: P O BOX 4567
    captures:
      box: '4567'
  counterexamples:
  - Along Thika Road
  - '34200'
- pattern: landmark-address
  label: A place given by a landmark
  means: address
  sequences:
  - - group: landmark-words
      as: relation
    - words: capitalised
      as: landmark
      repeat:
        min: 1
        max: 4
      lazy: true
    - group: place-words
      as: kind
      optional: true
  examples:
  - text: Along Thika Road
    captures:
      relation: Along
      landmark: Thika
      kind: Road
  - text: Opposite Sarit Centre
    captures:
      relation: Opposite
      landmark: Sarit
      kind: Centre
  counterexamples:
  - P.O. Box 12
- pattern: admin-unit
  label: A named administrative area
  means: place
  sequences:
  - - words: capitalised
      as: name
      repeat:
        min: 1
        max: 3
    - group: admin-levels
      as: level
  - - group: admin-levels
      as: level
    - punct: ':'
      optional: true
    - words: capitalised
      as: name
      repeat:
        min: 1
        max: 3
  examples:
  - text: Kiambu County
    captures:
      name: Kiambu
      level: County
  - text: 'Ward: Githurai'
    captures:
      level: Ward
      name: Githurai
  counterexamples:
  - Rawel Holdings Limited
- pattern: phone-number
  label: A telephone number
  means: phone
  sequences:
  - - punct: +
    - digits:
        min: 9
        max: 13
      as: number
  - - punct: +
    - digits:
        min: 1
        max: 3
      as: country
    - digits:
        min: 2
        max: 4
      as: a
    - digits:
        min: 3
        max: 4
      as: b
    - digits:
        min: 3
        max: 4
      as: c
      optional: true
  - - digits:
        min: 9
        max: 11
      as: number
  examples:
  - text: '+254712345678'
    captures:
      number: '254712345678'
  - text: 0712345678
    captures:
      number: 0712345678
  - text: +254 712 345 678
    captures:
      country: '254'
      a: '712'
      b: '345'
      c: '678'
  counterexamples:
  - P.O. Box 34200
  - '2012'
