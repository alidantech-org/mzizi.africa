patterns:
- pattern: money-amount
  label: An amount with its currency
  means: money
  sequences:
  - - group: currency-units
      as: unit
    - number: true
      as: amount
    - group: scale-words
      as: scale
      optional: true
  - - number: true
      as: amount
    - group: scale-words
      as: scale
      optional: true
    - group: currency-units
      as: unit
  - - number: true
      as: amount
    - group: scale-words
      as: scale
  examples:
  - text: KES 1,200,000.50
    captures:
      unit: KES
      amount: 1,200,000.50
  - text: USD 88,834,394.40
    captures:
      unit: USD
      amount: 88,834,394.40
  - text: 250 million KES
    captures:
      amount: '250'
      scale: million
      unit: KES
  - text: 2.5 million
    captures:
      amount: '2.5'
      scale: million
  counterexamples:
  - P.O. Box 34200
  - Rawel Holdings
  - 950,000
- pattern: plain-number
  label: A number with no unit
  means: number
  sequences:
  - - number: true
      as: amount
  examples:
  - text: 950,000
    captures:
      amount: 950,000
  - text: 88,834,394.40
    captures:
      amount: 88,834,394.40
  - text: '003'
    captures:
      amount: '003'
  counterexamples:
  - KES 950,000
  - Nairobi
