# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/engine/terms.schema.json
code: sys.trm.ke.documents
describe: 'Kenyan wording for document kinds and subjects: the Gazette, Kenyan laws, Kenyan fiscal terms.'
extends:
- sys.trm.global.documents
languages:
- en
groups:
- group: law
  terms:
  - value: act
    aliases:
    - political parties act
    - elections act
    - constitution of kenya
    - laws of kenya
  - value: regulations
    aliases:
    - legal notice
- group: notice
  terms:
  - value: gazette notice
    aliases:
    - kenya gazette
    - gazette
    - vol cxxii
    meaning: A notice in the Kenya Gazette
- group: news
  terms:
  - value: tv show
    aliases:
    - kbc
    - kbctv
    - eye on politics
- group: noise
  terms:
  - value: vacancy
    aliases:
    - amazon
- group: funding
  terms:
  - value: kes
    aliases:
    - ksh
    - kshs
    - kenya shillings
    - shillings
    meaning: Kenya shillings
- group: audit-budget
  terms:
  - value: budget
    aliases:
    - medium term expenditure framework
    - mtef
- group: people-places
  terms:
  - value: county
    aliases:
    - counties
    - constituency
    - ward
