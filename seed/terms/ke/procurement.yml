# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/engine/terms.schema.json
code: sys.trm.ke.procurement
describe: Kenyan public procurement wording and tender reference formats.
extends:
- sys.trm.global.procurement
languages:
- en
groups:
- group: procurement-words
  label: Kenyan procurement bodies and systems
  terms:
  - value: ppra
    aliases:
    - public procurement regulatory authority
    - ppoa
    - public procurement oversight authority
    kind: concept
  - value: ppard
    aliases:
    - public procurement administrative review board
    - review board
    - prb
    kind: concept
  - value: ifmis
    aliases:
    - integrated financial management information system
    kind: concept
  - value: e-procurement
    aliases:
    - eprocurement
    - mwanzo
    - tenders.go.ke
    - supplier registration portal
    - pls
    - prequalified suppliers
    kind: concept
  - value: agpo
    aliases:
    - access to government procurement opportunities
    - youth women and persons with disabilities
    - 30% reservation
    kind: concept
  - value: public procurement and asset disposal act
    aliases:
    - ppada
    - ppada 2015
    - public procurement and disposal act
    - ppda 2005
    kind: concept
  - value: county treasury
    aliases:
    - national treasury
    - tender committee
    - procurement committee
    - accounting officer
    - head of supply chain management
    - scm
    kind: concept
patterns:
- pattern: tender-reference
  label: A Kenyan tender reference
  means: reference
  sequences:
  - - letters:
        min: 2
        max: 12
        case: upper
      as: entity
    - punct: /
    - letters:
        min: 1
        max: 8
        case: upper
      as: kind
      optional: true
    - punct: /
      optional: true
    - digits:
        min: 1
        max: 5
      as: number
    - punct: /
    - digits:
        min: 4
        max: 4
      as: year
    - punct: '-'
      optional: true
    - digits:
        min: 2
        max: 4
      as: year_end
      optional: true
  examples:
  - text: ORPP/OT/012/2024-2025
    captures:
      entity: ORPP
      kind: OT
      number: '012'
      year: '2024'
      year_end: '2025'
  - text: MOH/RFQ/045/2023
    captures:
      entity: MOH
      kind: RFQ
      number: '045'
      year: '2023'
  counterexamples:
  - Rawel Holdings
  - P.O. Box 34200
