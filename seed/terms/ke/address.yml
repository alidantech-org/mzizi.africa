# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/engine/terms.schema.json
code: sys.trm.ke.address
describe: Kenyan address wording and landmarks, drawn from the IEBC office-location tables. Named places are in the geography data,
  not here.
extends:
- sys.trm.global.address
languages:
- en
groups:
- group: landmark-words
  label: Kenyan landmarks used to place an office
  terms:
  - value: dcc's compound
    aliases:
    - dcc compound
    - dcc's office
    - dcc office
    - county commissioner's compound
    - county commissioners compound
    - county commissioner's office
    - cc's office
    - cdf office
    - cdf offices
    - sub-county offices
    - sub county offices
    - sub-county headquarters
    - district headquarters
    kind: pattern-word
  - value: huduma centre
    aliases:
    - huduma center
    - chief's camp
    - chief's office
    - assistant chief's office
    - police station
    - police post
    - law courts
    - magistrate's court
    - court house
    - ardhi house
    - nssf building
    - nhif building
    - kenya power
    - kplc
    - post office building
    - posta building
    - county offices
    - county headquarters
    - ward offices
    - ward office
    - town hall
    - city hall
    - kanu offices
    - kicc
    kind: pattern-word
  - value: catholic church
    aliases:
    - pag church
    - anglican church
    - acc church
    - friends church
    - mosque
    - cathedral
    - parish
    - mission
    - primary school
    - secondary school
    - high school
    - sacco building
    - cooperative building
    - equity bank
    - kcb bank
    - cooperative bank
    - barclays
    - standard chartered
    - family bank
    - stanbic
    kind: pattern-word
- group: office-location-headings
  label: Headings of an office location
  terms:
  - value: office location
    aliases:
    - location of office
    - physical location of office
    - office address
    - location of the office
    - location of iebc office
    - constituency office
    kind: concept
- group: landmark-headings
  label: Headings of a landmark
  terms:
  - value: most conspicuous landmark
    aliases:
    - conspicuous landmark
    - landmark
    - nearby landmark
    - beacon
    - nearest landmark
    kind: concept
- group: distance-headings
  label: Headings of a distance
  terms:
  - value: estimated distance to the office
    aliases:
    - distance to the office
    - distance from the landmark
    - estimated distance
    - distance
    - walking distance
    kind: concept
patterns:
- pattern: distance-to-office
  label: A distance from a landmark
  means: reference
  sequences:
  - - number: true
      as: value
    - any_of:
      - literal: metres
      - literal: meters
      - literal: metre
      - literal: m
      - literal: km
      - literal: kilometres
      - literal: kilometers
      as: unit
  examples:
  - text: 100 Metres
    captures:
      value: '100'
      unit: Metres
  - text: 2 Km
    captures:
      value: '2'
      unit: Km
  counterexamples:
  - Same Compound
