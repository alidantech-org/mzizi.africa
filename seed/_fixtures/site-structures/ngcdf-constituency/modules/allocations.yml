module: allocations
discover:
  listing:
    url: /allocations/
    items: [{ css: "table.table tr", confidence: 0.6 }]
extract:
  fields:
    amount: { from: { css: "td:nth-of-type(1)" } }
    fiscal_year: { from: { css: "td:nth-of-type(2)" } }
expect: { min_items: 1, required_fields: [amount, fiscal_year] }
