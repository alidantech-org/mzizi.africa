# The one seed manifest (release 2026-11-11.1). Authored by hand; validated against source/schema/seed/manifest.schema.json.
# It binds every uploadable file under global/, system/ and countries/ to a loader and says how the file is versioned.
# Per-folder facts (role, access, preparation, scope, review) live in each folder's _folder.yaml and are inherited.
# Hashes and object keys are generated into manifest.lock.yaml by `uv run mzizi-manifest lock`.
#
# Bucket mapping: seed/<path> is registered as <logical_root>/<path> and stored at <access><logical_root>/<path>,
# for example seed/global/auth/roles.csv -> internal/seed/global/auth/roles.csv.
# versioning: versioned (default) keeps a replaced revision at .../_versions/<name>/r<NNNN>/<name>; current keeps no history.
# Folders whose name begins with "_" (_fixtures, _examples) are local-only and must not appear here.
schema_version: 2
release: 2026-11-11.1
bucket: mzizi
region: us-east-1
logical_root: /seed
root_code: seed
defaults:
  versioning: versioned
  pin: true
entries:
