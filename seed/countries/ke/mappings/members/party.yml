mapping: party
extractor: parliament-members
target_kind: political.parties
key: [code]
fields:
  code:           { from: partyCode }
  name:           { from: party }
  abbreviation:   { from: partyAbbreviation }
  jurisdictionId: { const: { $ref: { kind: reference.jurisdictions, where: { code: "${jurisdiction}" } } } }
  status:         { const: active }
provenance:
  locator: { row: $row }
  method: extracted
