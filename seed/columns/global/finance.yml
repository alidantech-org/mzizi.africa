# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/engine/columns.schema.json
code: sys.col.global.finance
describe: Columns of money flows, funds, appropriations and budgets.
columns:
  finance.flows.amount_minor_units:
    means: The money moved
    shape: money
    terms:
    - list: sys.trm.global.money
      key: amount-payment
      role: heading
    - list: sys.trm.global.money
      key: amount-allocation
      role: heading
    - list: sys.trm.global.money
      key: amount-generic
      role: heading
      weight: 0.6
    - list: sys.trm.global.money
      key: currency-units
      role: unit
    - list: sys.trm.global.money
      key: money-amount
      role: value
    - list: sys.trm.global.money
      key: plain-number
      role: value
      weight: 0.7
  finance.flows.counterparty_entity_code:
    means: The other side of the money
    shape: name
    terms:
    - list: sys.trm.global.finance
      key: recipient-headings
      role: heading
    - list: sys.trm.global.politics
      key: party-name-headings
      role: heading
      says: organisation
      weight: 0.9
    - list: sys.trm.global.organisations
      key: organisation-headings
      role: heading
      says: organisation
      weight: 0.5
  finance.flows.occurred_on:
    means: When the money moved
    shape: date
    terms:
    - list: sys.trm.global.dates
      key: date-paid
      role: heading
  finance.flows.fund_code:
    means: Which fund
    terms:
    - list: sys.trm.global.finance
      key: fund-headings
      role: heading
  finance.flows.fiscal_period_code:
    means: Which financial period
    terms:
    - list: sys.trm.global.dates
      key: period-headings
      role: heading
    - list: sys.trm.global.dates
      key: fiscal-year
      role: value
  finance.appropriations.amount_minor_units:
    means: An approved amount
    shape: money
    terms:
    - list: sys.trm.global.money
      key: amount-budget
      role: heading
    - list: sys.trm.global.money
      key: amount-allocation
      role: heading
    - list: sys.trm.global.money
      key: currency-units
      role: unit
    - list: sys.trm.global.money
      key: money-amount
      role: value
    - list: sys.trm.global.money
      key: plain-number
      role: value
      weight: 0.7
  finance.appropriations.recipient_entity_code:
    means: Who receives an appropriation
    shape: name
    terms:
    - list: sys.trm.global.finance
      key: recipient-headings
      role: heading
    - list: sys.trm.global.organisations
      key: organisation-headings
      role: heading
      weight: 0.6
  finance.budgets.government_entity_code:
    means: The government that owns a budget
    shape: name
    terms:
    - list: sys.trm.global.finance
      key: government-headings
      role: heading
    - list: sys.trm.global.organisations
      key: org-types
      role: value
      says: organisation
tables:
  finance.flows:
    describe: One movement of money; its code is the fund, the period and the counterparty.
    code:
      parts:
      - code: finance.flows.fund_code
        optional: true
      - last: finance.flows.fiscal_period_code
        optional: true
      - last: finance.flows.counterparty_entity_code
      unique_within:
      - finance.flows.occurred_on
