# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/engine/terms.schema.json
code: sys.trm.src.doc.ke.register
describe: Words that mark a register, roll or list of named entities with status.
terms:
  - { value: register, aliases: [register of particulars, rejista, list of political parties], meaning: An official record of entities }
  - { value: fully registered, aliases: [provisionally registered, registered parties, usajili wa muda], meaning: Status of an entity }
  - { value: certificate serial, aliases: [certificate date of issue, date of issue, cheti], meaning: Proof of registration }
  - { value: nomination particulars, aliases: [particulars of the party] }
  - { value: cleared for election }
  - { value: name of the party, aliases: [name of party, party abbreviation, location of head office] }
