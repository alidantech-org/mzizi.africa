# Sync manifest for the old infrastructure artifacts relocated from the git-ignored .data directory (8 November 2026).
# The files live in the ignored subtree seed/generated/legacy-artifacts; this tracked manifest is their registry treatment.
# NOT included on purpose: .data/raw (an excluded historical collection awaiting separate reconciliation), and the credential-bearing
# material that stays in .data (dev.env, env.local, p4-scratch.env, real.env, dev-auth/) which no ordinary sync may publish.
# Origin is recorded as what the artifacts are (generated backups, reports, logs, stored objects), never as curated seed data.
schema_version: 1
kind: filesystem-sync
name: legacy-artifacts
release: "2026-11-08.1"
root: generated/legacy-artifacts
logical_root: /legacy-artifacts
defaults: {retention: preserve_history}
folders:
  - path: /legacy-artifacts
    seed_code: legacy-artifacts
    description: "Old infrastructure artifacts relocated from .data for registration. Not seed data."
    classification:
      access: internal
      allow_weaker_children: false
      is_seed: false
      review: {status: needs_review, note: "Relocated from the local .data directory on 2026-11-08; origin classes are inferred from file kinds and require confirmation."}
entries:
  - id: backups
    source: {path: backups, include: ["**/*.dump"]}
    seed_code: legacy-artifacts/backups
    registry_prefix: legacy/backups
    description: "pg_dump snapshots of the earlier Dryv-entity databases taken during the 2026-11-02..03 data-engine work."
    classification:
      access: private
      artifact_role: backup
      acquisition_class: internally_derived
      preparation: programmatically_generated
      review: {status: needs_review, note: "Database dumps; contents were not inspected and may hold personal data or development account rows, so they stay private. Superseded by the disposable rewrite database."}
  - id: reports
    source: {path: reports}
    seed_code: legacy-artifacts/reports
    registry_prefix: legacy/reports
    description: "Pipeline run reports and logs (JSON, text and log files) from the earlier engines."
    classification:
      access: internal
      artifact_role: report
      acquisition_class: internally_derived
      preparation: programmatically_generated
      review: {status: needs_review, note: "Generated by the earlier engines; some reports summarize collected public data. Checked for private-key and bearer-token markers: none found."}
  - id: logs
    source: {path: logs}
    seed_code: legacy-artifacts/logs
    registry_prefix: legacy/logs
    description: "API and web development server logs."
    classification:
      access: internal
      artifact_role: log
      acquisition_class: internally_derived
      preparation: programmatically_generated
      review: {status: needs_review, note: "Checked for private-key, bearer-token, JWT, password and cloud-key markers: none found."}
  - id: certificates
    source: {path: certificates}
    seed_code: legacy-artifacts/certificates
    registry_prefix: legacy/certificates
    description: "CA certificate bundle used for a government site chain (public certificates only)."
    classification:
      access: internal
      artifact_role: certificate
      acquisition_class: externally_collected
      preparation: unknown
      review: {status: needs_review, note: "Public CA certificates only (no private key); how the bundle was assembled is not recorded."}
  - id: objects
    source: {path: objects/sha256}
    folder: /legacy-artifacts/objects
    seed_code: legacy-artifacts/objects
    registry_prefix: legacy/objects
    flatten: true
    description: "Content-addressed bytes of the earlier local directory store (file name is the SHA-256 of the content). Their database metadata is gone with the disposable legacy schema."
    classification:
      access: private
      artifact_role: object_store
      acquisition_class: externally_collected
      preparation: programmatically_generated
      review: {status: needs_review, note: "Preserved evidence bytes captured from public sources by the earlier engines; kept private until their provenance is reconciled."}
