schema: mzizi.site/v1
site: world/geoboundaries
fetch: { mode: api }
modules: [releases]
tags: [purpose:data-portal, kind:boundary, platform:custom]
policy:
  assessment: { ref: assess-world-geoboundaries-pending }
  licence: { ref: unknown }
  scope:
    hosts: [www.geoboundaries.org]
    schemes: [https]
    paths: { allow: [/api/current/gbOpen/] }
  rate: { requests_per_second: 0.2, max_concurrency: 1 }
  retries: { max: 2, backoff: exponential_jitter }
  limits: { max_response_bytes: 10485760, timeout_seconds: 30 }
  identify: { user_agent: "MziziBot/0.1 (+https://example.invalid/bot; contact@example.invalid)" }
  robots: respect
  auth: none
  stop_on: ["401", "403", "429", repeated_5xx]
  purposes: [research, public_atlas]
