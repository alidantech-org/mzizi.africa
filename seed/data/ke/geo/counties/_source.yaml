# Where this folder's rows come from. Rows were built from the downloaded files in .dev/datasets/ (outside git); the CSV extract named below is a plain dump of the source columns, rebuilt from those files, and `mzizi-manifest verify` compares the seed against it.
status: verified
dataset:
  name: OCHA COD-AB Kenya level 1 (47 counties), place codes by IEBC
  publisher: OCHA Regional Office for Southern and Eastern Africa and OCHA FIS; data from the IEBC
  licence: CC BY-IGO
  url: https://data.humdata.org/dataset/cod-ab-ken
  boundary_id: COD-AB-KEN-v01
  local_copy: .dev/datasets/extracts/ocha-ken-adm1.csv
  sha256: efd8c9e4c85d2f1623368fd4bf51830c52fc6b4ff5e435c345e745552bad3afc
  original: {file: ken_admin_boundaries.xlsx, sha256: 530f002f4b1561c5675f6978713770fe5f7f739af9d703f1a3881b5b469e88fc}
checks:
  complete: true
  identifiers:
    - {scheme: geo.identifier.scheme.ke-iebc-pcode, property: iebc_pcode}
    - {scheme: geo.identifier.scheme.ocha-pcode, property: pcode}
  names:
    - {kind: geo.name.kind.official, property: name}
notes:
  - "The geoBoundaries ADM1 id and ISO 3166-2 code on each county come from geoBoundaries KEN-ADM1-32016919 (Public Domain, copy in .dev/archives, simplified); they are not checked by verify. Where geoBoundaries spells a name differently (Tharaka for Tharaka-Nithi) the short name row records it."
  - "The county numbers 001 to 047 match English Wikipedia's Counties of Kenya and the IEBC place codes."
  - "Start dates: valid_from 4 March 2013 and valid_from_earliest 27 August 2010 are judgment calls, not from the datasets."
