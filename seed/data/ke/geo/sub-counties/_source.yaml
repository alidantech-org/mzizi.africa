# Where this folder's rows come from. Rows were built from the downloaded files in .dev/datasets/ (outside git); the CSV extract named below is a plain dump of the source columns, rebuilt from those files, and `mzizi-manifest verify` compares the seed against it.
status: verified
dataset:
  name: Kenya Sub Counties (matched to former provinces and DHIS2 ids)
  publisher: American Red Cross (HDX, kenya-sub-counties)
  licence: CC BY
  url: https://data.humdata.org/dataset/kenya-sub-counties
  boundary_id: kenya-sub-counties
  local_copy: .dev/datasets/extracts/redcross-ken-subcounties.csv
  sha256: c9b25bfbfdc2e7a3ef4b3691613b694f83bb39d60c32b571b60a4c94830044c9
  original: {file: ke_subcounty.zip, sha256: b4b7ef38671316c2c066bb91f87ecad3565b6724c3bfb2d2e2fe8c6091eadba3}
checks:
  complete: true
  identifiers:
    - {scheme: geo.identifier.scheme.dhis2-uid, property: dhis2_id}
  names:
    - {kind: geo.name.kind.official, property: name}
notes:
  - "304 sub-counties, not 290: sub-counties and constituencies are different layers. The dataset also gives each sub-county's former province; that link is not seeded yet."
  - "A sub-county code carries the -sub-county suffix because a constituency can share its name (Mvita)."
  - "No start date is recorded; the dataset gives none."
