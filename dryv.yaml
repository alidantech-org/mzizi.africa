version: dryv/v1alpha1

# Dryv project for the Mzizi API. The project root is the repository root so generated output can
# land in source/backend/api (destinations may not leave the root). Contracts and project packs live
# in dryv/. Pin: Dryv engine a7b13a30 (canonical applications and stores),
# packs 7fdaa6f0d0d35f0522aabcd2699e48cabf31b46a.

sources:
  authoring:
    pgsql:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/pgsql/index.ts
    api:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/api/index.ts
    engine:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/engine/index.ts
    app:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/app/index.ts
    web:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/web/index.ts
    dev:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/dev/index.ts
  packs:
    # The local checkout of the official packs repository, pinned to the commit that declares TypeORM store
    # support; switch back to the GitHub repository once that commit is published.
    official:
      repository: file:///home/alidante/Projects/personal/alidantech-org/codepot/packs
      ref: a5693954038a7916a7436076efcb8f3173d05898
      root: packs
    project: { path: dryv/packs }

actions:
  imports:
    stage: files
    extensions: [.ts, .tsx]
    commands:
      - run: [ bun, x, biome, lint, --write, --unsafe, --only=correctness/noUnusedImports ,$(files) ]
  # Generated TypeScript is formatted with Prettier defaults, matching the editor.
  format-ts:
    stage: files
    extensions: [.ts, .tsx]
    commands:
      - run:
          [bun, x, prettier, --config, source/backend/api/.prettierrc, --ignore-path, .prettier-none, --write, $(files)]
  # Generated SQL is formatted after generation (sql-formatter via the database CLI).
  format-sql:
    stage: files
    extensions: [.sql]
    commands:
      - run: [bun, source/backend/database/src/cli.ts, format, $(files)]
  typecheck:
    stage: final
    after: [install]
    commands:
      - run: [bun, x, tsc, -p, ../../tsconfig.json]
  # Generated Dart is formatted with dart format (the default 80-column style Flutter projects use).
  format-dart:
    stage: files
    extensions: [.dart]
    commands:
      - run: [dart, format, $(files)]
  # Generated Python is formatted and import-sorted with the repository's ruff settings,
  # then type-checked with the repository's strict mypy settings.
  lint-py:
    stage: files
    extensions: [.py]
    commands:
      - run: [uv, run, ruff, check, --fix, $(files)]
  format-py:
    stage: files
    extensions: [.py]
    after: [lint-py]
    commands:
      - run: [uv, run, ruff, format, $(files)]
  typecheck-py:
    stage: final
    commands:
      - run: [uv, run, mypy, -p, mzizi_engine.api]

destinations:
  ir:
    compiled: { path: dryv/.dryv/ir/dryv.ir.yaml }
    pgsql:
      path: dryv/.dryv/ir/dryv.pgsql.ir.yaml
      authoring: { $ref: "#/sources/authoring/pgsql" }
    api:
      path: dryv/.dryv/ir/dryv.api.ir.yaml
      authoring: { $ref: "#/sources/authoring/api" }
    engine:
      path: dryv/.dryv/ir/dryv.engine.ir.yaml
      authoring: { $ref: "#/sources/authoring/engine" }
    app:
      path: dryv/.dryv/ir/dryv.app.ir.yaml
      authoring: { $ref: "#/sources/authoring/app" }
    web:
      path: dryv/.dryv/ir/dryv.web.ir.yaml
      authoring: { $ref: "#/sources/authoring/web" }
    dev:
      path: dryv/.dryv/ir/dryv.dev.ir.yaml
      authoring: { $ref: "#/sources/authoring/dev" }
  # Injected NestJS modules: source/backend/api/src/modules/<group>/...
  modules:
    path: source/backend/api/src/modules
    imports: { path: source/backend/api/src, prefix: "#/" }
    choose: { js.package_manager: bun }
    actions:
      - { $ref: "#/actions/imports" }
      - { $ref: "#/actions/format-ts" }
      - { $ref: "#/actions/typecheck" }
  # Tests live outside src and mirror its layout: test/modules/<group>/... and test/app.e2e.spec.ts.
  modules-test:
    path: source/backend/api/test/modules
    imports: { path: source/backend/api/test, prefix: "@test/" }
    choose: { js.package_manager: bun }
    actions:
      - { $ref: "#/actions/format-ts" }
  test-root:
    path: source/backend/api/test
    imports: { path: source/backend/api/test, prefix: "@test/" }
    choose: { js.package_manager: bun }
    actions:
      - { $ref: "#/actions/format-ts" }
  # The package root: the vitest config.
  package:
    path: source/backend/api
    choose: { js.package_manager: bun }
    actions:
      - { $ref: "#/actions/format-ts" }
  # app.module.ts and the database/ scaffold.
  app:
    path: source/backend/api/src
    imports: { path: source/backend/api/src, prefix: "#/" }
    choose: { js.package_manager: bun }
    actions:
      - { $ref: "#/actions/format-ts" }
  # FastAPI schemas and routes for the engine: source/backend/engine/src/mzizi_engine/api/...
  # Python schemas, one folder per origin: postgres (entities, enums), mongo (enums, models), api (engine contract models).
  engine-schemas-postgres:
    path: source/backend/engine/src/mzizi_engine/api/schemas/postgres
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
      - { $ref: "#/actions/typecheck-py" }
  engine-schemas-mongo:
    path: source/backend/engine/src/mzizi_engine/api/schemas/mongo
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
      - { $ref: "#/actions/typecheck-py" }
  engine-schemas-api:
    path: source/backend/engine/src/mzizi_engine/api/schemas/api
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
      - { $ref: "#/actions/typecheck-py" }
  # Contract tests mirror the source layout: tests/api/schemas/<group>/models and tests/api/routes/<group>.
  engine-tests-api:
    path: source/backend/engine/tests/api
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
  engine-tests-schemas:
    path: source/backend/engine/tests/api/schemas
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
  engine-tests-schemas-api:
    path: source/backend/engine/tests/api/schemas/api
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
  engine-tests-schemas-mongo:
    path: source/backend/engine/tests/api/schemas/mongo
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
  engine-tests-routes:
    path: source/backend/engine/tests/api/routes
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
  engine-routes:
    path: source/backend/engine/src/mzizi_engine/api/routes
    imports: { path: source/backend/engine/src/mzizi_engine, prefix: "mzizi_engine/" }
    actions:
      - { $ref: "#/actions/lint-py" }
      - { $ref: "#/actions/format-py" }
      - { $ref: "#/actions/typecheck-py" }
  # Generated frontends. They import the shared SDKs under source/sdk and generate no client code of their own.
  web-app:
    path: source/apps/web
    imports: { path: source/apps/web, prefix: "#/" }
    actions:
      - { $ref: "#/actions/imports" }
      - { $ref: "#/actions/format-ts" }
  dev-app:
    path: source/apps/dev
    imports: { path: source/apps/dev, prefix: "#/" }
    actions:
      - { $ref: "#/actions/imports" }
      - { $ref: "#/actions/format-ts" }
  app-app:
    path: source/apps/app
    imports: { path: source/apps/app/lib, prefix: "package:mzizi_app/" }
    actions:
      - { $ref: "#/actions/format-dart" }
  # Shared client SDKs generated from the product API contract; the frontends import these packages.
  sdk-ts:
    path: source/sdk/api-ts
    imports: { path: source/sdk/api-ts/src, prefix: "#sdk/" }
    actions:
      - { $ref: "#/actions/imports" }
      - { $ref: "#/actions/format-ts" }
  sdk-engine-ts:
    path: source/sdk/engine-ts
    imports: { path: source/sdk/engine-ts/src, prefix: "#sdk/" }
    actions:
      - { $ref: "#/actions/imports" }
      - { $ref: "#/actions/format-ts" }
  sdk-dart:
    path: source/sdk/api-dart
    imports: { path: source/sdk/api-dart/lib, prefix: "package:mzizi_api/" }
    actions:
      - { $ref: "#/actions/format-dart" }
  # Generated system catalogs: one JSON document per application, read by the root pages and the web app.
  catalog-api:
    path: source/backend/api/src/system/catalog
  catalog-engine:
    path: source/backend/engine/src/mzizi_engine/api/catalog
  # Generated table schemas, one JSON file per PostgreSQL schema, used to validate seed CSV files.
  table-schemas:
    path: source/schema/database
  # Database SQL: one schema snapshot lands in source/backend/database/sql; the Bun CLI
  # (`bun run db assemble`) turns it into immutable checksummed releases under
  # source/backend/database/migrations (never written by generation directly).
  postgres-sql:
    path: source/backend/database/sql
    actions:
      - { $ref: "#/actions/format-sql" }

authoring:
  source: { $ref: "#/sources/authoring/pgsql" }
  destination: { $ref: "#/destinations/ir/compiled" }

packs:
  types:
    source: { $ref: "#/sources/packs/official", path: inject/types/typescript }
    destination: { $ref: "#/destinations/modules" }

  dtos:
    source:
      {
        $ref: "#/sources/packs/official",
        path: inject/validation/class-validator,
      }
    destination: { $ref: "#/destinations/modules" }
    destinations:
      test: { $ref: "#/destinations/modules-test" }
    bind:
      property.enum.types: { $ref: "#/packs/types" }
      property.types: { $ref: "#/packs/types" }

  entities:
    source:
      { $ref: "#/sources/packs/official", path: inject/persistence/typeorm }
    store: { $ref: "#/stores/main" }
    destination: { $ref: "#/destinations/modules" }
    destinations:
      test: { $ref: "#/destinations/modules-test" }
    bind:
      property.enum.types: { $ref: "#/packs/types" }
      property.types: { $ref: "#/packs/types" }

  type-files:
    source: { $ref: "#/sources/packs/project", path: type-files }
    destination: { $ref: "#/destinations/modules" }
    bind:
      property.enum.types: { $ref: "#/packs/types" }

  use-cases:
    source: { $ref: "#/sources/packs/project", path: use-cases }
    destination: { $ref: "#/destinations/modules" }
    destinations:
      test: { $ref: "#/destinations/modules-test" }
      app: { $ref: "#/destinations/app" }
    bind:
      schema.validation: { $ref: "#/packs/dtos" }
      schema.types: { $ref: "#/packs/type-files" }
      schema.persistence: { $ref: "#/packs/entities" }

  server:
    source: { $ref: "#/sources/packs/official", path: inject/backend/nestjs }
    destination: { $ref: "#/destinations/modules" }
    destinations:
      app: { $ref: "#/destinations/app" }
      test: { $ref: "#/destinations/modules-test" }
      test-app: { $ref: "#/destinations/test-root" }
      package: { $ref: "#/destinations/package" }
    bind:
      schema.validation: { $ref: "#/packs/dtos" }
      schema.persistence: { $ref: "#/packs/entities" }
      schema.examples: { $ref: "#/packs/dtos" }
      operation.usecase: { $ref: "#/packs/use-cases" }
      module.provider: { $ref: "#/packs/use-cases" }

  python-rows:
    source: { $ref: "#/sources/packs/project", path: python-rows }
    store: { $ref: "#/stores/main" }
    destination: { $ref: "#/destinations/engine-schemas-postgres" }

  python-mongo:
    source: { $ref: "#/sources/packs/project", path: python-mongo }
    destination: { $ref: "#/destinations/engine-schemas-mongo" }
    destinations:
      tests: { $ref: "#/destinations/engine-tests-schemas-mongo" }

  python-api:
    source: { $ref: "#/sources/packs/project", path: python-api }
    destination: { $ref: "#/destinations/engine-schemas-api" }
    destinations:
      routes: { $ref: "#/destinations/engine-routes" }
      tests-api: { $ref: "#/destinations/engine-tests-api" }
      tests-schemas-root: { $ref: "#/destinations/engine-tests-schemas" }
      tests-schemas: { $ref: "#/destinations/engine-tests-schemas-api" }
      tests-routes: { $ref: "#/destinations/engine-tests-routes" }


  table-schemas:
    source: { $ref: "#/sources/packs/project", path: table-schemas }
    store: { $ref: "#/stores/main" }
    destination: { $ref: "#/destinations/table-schemas" }

  catalog-api:
    source: { $ref: "#/sources/packs/project", path: system-catalog }
    destination: { $ref: "#/destinations/catalog-api" }

  catalog-engine:
    source: { $ref: "#/sources/packs/project", path: system-catalog }
    destination: { $ref: "#/destinations/catalog-engine" }


  postgres-sql:
    source: { $ref: "#/sources/packs/project", path: postgres-sql }
    store: { $ref: "#/stores/main" }
    destination: { $ref: "#/destinations/postgres-sql" }
    outputs: { snapshot: { name: schema } }

  sdk-ts:
    source: { $ref: "#/sources/packs/project", path: sdk-ts }
    destination: { $ref: "#/destinations/sdk-ts" }
    inputs:
      package_name: "@mzizi/api-client"

  sdk-engine-ts:
    source: { $ref: "#/sources/packs/project", path: sdk-engine-ts }
    destination: { $ref: "#/destinations/sdk-engine-ts" }
    inputs:
      package_name: "@mzizi/engine-client"

  sdk-dart:
    source: { $ref: "#/sources/packs/project", path: sdk-dart }
    destination: { $ref: "#/destinations/sdk-dart" }
    inputs:
      package_name: mzizi_api

  web-theme:
    source: { $ref: "#/sources/packs/project", path: theme-css }
    destination: { $ref: "#/destinations/web-app" }
    operations: consumed

  web-app:
    source: { $ref: "#/sources/packs/project", path: app-next }
    destination: { $ref: "#/destinations/web-app" }
    operations: consumed
    inputs:
      port: "3300"
      sdk_path: ../../sdk/api-ts
      workspace_root: ../..
    bind:
      operation.client: { $ref: "#/packs/sdk-ts" }

  dev-theme:
    source: { $ref: "#/sources/packs/project", path: theme-css }
    destination: { $ref: "#/destinations/dev-app" }
    operations: consumed

  dev-app:
    source: { $ref: "#/sources/packs/project", path: app-next }
    destination: { $ref: "#/destinations/dev-app" }
    operations: consumed
    inputs:
      port: "3400"
      sdk_path: ../../sdk/api-ts
      workspace_root: ../..
    bind:
      operation.client: { $ref: "#/packs/sdk-ts" }

  app-theme:
    source: { $ref: "#/sources/packs/project", path: theme-dart }
    destination: { $ref: "#/destinations/app-app" }
    operations: consumed

  app-app:
    source: { $ref: "#/sources/packs/project", path: app-flutter }
    destination: { $ref: "#/destinations/app-app" }
    operations: consumed
    inputs:
      api_path: ../../sdk/api-dart
      ui_path: ../../sdk/ui/flutter
    bind:
      operation.client: { $ref: "#/packs/sdk-dart" }
      schema.types: { $ref: "#/packs/sdk-dart" }

applications:
  pgsql:
    authoring: { $ref: "#/sources/authoring/pgsql" }
    application: { $ref: "#/applications/mzizi-pgsql" }
    packs:
      - { $ref: "#/packs/postgres-sql" }
      - { $ref: "#/packs/python-rows" }
      - { $ref: "#/packs/table-schemas" }
  engine:
    authoring: { $ref: "#/sources/authoring/engine" }
    application: { $ref: "#/applications/mzizi-engine" }
    packs:
      - { $ref: "#/packs/python-mongo" }
      - { $ref: "#/packs/python-api" }
      - { $ref: "#/packs/catalog-engine" }
      - { $ref: "#/packs/sdk-engine-ts" }
  api:
    authoring: { $ref: "#/sources/authoring/api" }
    application: { $ref: "#/applications/mzizi-api" }
    packs:
      - { $ref: "#/packs/types" }
      - { $ref: "#/packs/dtos" }
      - { $ref: "#/packs/entities" }
      - { $ref: "#/packs/type-files" }
      - { $ref: "#/packs/use-cases" }
      - { $ref: "#/packs/server" }
      - { $ref: "#/packs/catalog-api" }
      - { $ref: "#/packs/sdk-ts" }
      - { $ref: "#/packs/sdk-dart" }
  app:
    authoring: { $ref: "#/sources/authoring/app" }
    application: { $ref: "#/applications/mzizi-app" }
    packs:
      - { $ref: "#/packs/app-app" }
      - { $ref: "#/packs/app-theme" }
  web:
    authoring: { $ref: "#/sources/authoring/web" }
    application: { $ref: "#/applications/mzizi-web" }
    packs:
      - { $ref: "#/packs/web-app" }
      - { $ref: "#/packs/web-theme" }
  dev:
    authoring: { $ref: "#/sources/authoring/dev" }
    application: { $ref: "#/applications/mzizi-dev" }
    packs:
      - { $ref: "#/packs/dev-app" }
      - { $ref: "#/packs/dev-theme" }

stores:
  main:
    driver: postgresql
    database: mzizi
    runtime_env: MZIZI_DB_URL
    admin_env: MZIZI_DB_ADMIN_URL

# Durable approvals remain local unless the project explicitly opts into repository storage.
checkpoints: { storage: local }

build:
  cache: reuse
  default_action: generate
