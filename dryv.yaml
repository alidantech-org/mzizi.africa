version: dryv/v1alpha1

# Dryv project for the Mzizi API. The project root is the repository root so generated output can
# land in source/backend/api (destinations may not leave the root). Contracts and project packs live
# in dryv/. Pin: Dryv engine 089607c2ee6c94742492c22b2d06d062851985e2 (multi-authoring),
# packs 7fdaa6f0d0d35f0522aabcd2699e48cabf31b46a.

sources:
  authoring:
    model:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/main/index.ts
    # Database foundation model, compiled separately for the Rust packs (Dryv multi-authoring:
    # one generate run compiles both entrypoints and routes each pack to its source's IR).
    database:
      type: typescript
      path: dryv/contracts
      entrypoint: apps/database/index.ts
  packs:
    official:
      repository: https://github.com/dryvcode/packs
      ref: 7fdaa6f0d0d35f0522aabcd2699e48cabf31b46a
      root: packs
    project: { path: dryv/packs }

actions:
  imports:
    stage: files
    extensions: [.ts]
    commands:
      - run:
          [
            bun,
            x,
            biome,
            lint,
            --write,
            --unsafe,
            --only=correctness/noUnusedImports,
            $(files),
          ]
  typecheck:
    stage: final
    after: [install]
    commands:
      - run: [bun, x, tsc, -p, ../tsconfig.json]

destinations:
  ir:
    compiled: { path: dryv/.dryv/ir/dryv.ir.yaml }
    database:
      path: dryv/.dryv/ir/dryv.database.ir.yaml
      authoring: { $ref: "#/sources/authoring/database" }
  # Injected NestJS modules: source/backend/api/src/modules/<group>/...
  modules:
    path: source/backend/api/src/modules
    imports: { path: source/backend/api/src, prefix: "#/" }
    choose: { js.package_manager: bun }
    actions:
      - { $ref: "#/actions/imports" }
      - { $ref: "#/actions/typecheck" }
  # app.module.ts and the database/ scaffold.
  app:
    path: source/backend/api/src
    imports: { path: source/backend/api/src, prefix: "#/" }
    choose: { js.package_manager: bun }
  # Shared framework-free declarations: source/backend/api/src/types/<group>/...
  types:
    path: source/backend/api/src/types
    imports: { path: source/backend/api/src, prefix: "#/" }
    choose: { js.package_manager: bun }
  # Rust database foundation outputs. Models land in the generated crate; SQL lands as
  # per-database schema snapshots that `mzizi-db assemble` turns into immutable checksummed
  # releases under source/backend/database/migrations (never written by generation directly).
  rust-generated:
    path: source/backend/database/crates/mzizi-db-generated/src/models
  rust-sql:
    path: source/backend/database/generated/sql

authoring:
  source: { $ref: "#/sources/authoring/model" }
  destination: { $ref: "#/destinations/ir/compiled" }

packs:
  types:
    source: { $ref: "#/sources/packs/official", path: inject/types/typescript }
    destination: { $ref: "#/destinations/types" }

  dtos:
    source:
      {
        $ref: "#/sources/packs/official",
        path: inject/validation/class-validator,
      }
    destination: { $ref: "#/destinations/modules" }
    bind:
      property.enum.types: { $ref: "#/packs/types" }
      property.types: { $ref: "#/packs/types" }

  entities:
    source:
      { $ref: "#/sources/packs/official", path: inject/persistence/typeorm }
    destination: { $ref: "#/destinations/modules" }
    bind:
      property.enum.types: { $ref: "#/packs/types" }
      property.types: { $ref: "#/packs/types" }

  type-files:
    source: { $ref: "#/sources/packs/project", path: type-files }
    destination: { $ref: "#/destinations/modules" }
    bind:
      property.enum.types: { $ref: "#/packs/types" }

  use-cases:
    source: { $ref: "#/sources/packs/project", path: use-cases }
    destination: { $ref: "#/destinations/modules" }
    bind:
      schema.validation: { $ref: "#/packs/dtos" }
      schema.persistence: { $ref: "#/packs/entities" }

  server:
    source: { $ref: "#/sources/packs/official", path: inject/backend/nestjs }
    destination: { $ref: "#/destinations/modules" }
    destinations:
      app: { $ref: "#/destinations/app" }
    bind:
      schema.validation: { $ref: "#/packs/dtos" }
      schema.persistence: { $ref: "#/packs/entities" }
      schema.examples: { $ref: "#/packs/dtos" }
      operation.implementation: { $ref: "#/packs/use-cases" }
      operation.usecase: { $ref: "#/packs/use-cases" }

  # Rust database foundation: both packs consume the `database` authoring source. The
  # namespace-to-database lists mirror dryv/contracts/apps/database/persistence.ts (the
  # canonical catalogue); tools/audit-database-assignments.ts fails database:check on drift.
  rust-models:
    source: { $ref: "#/sources/packs/project", path: rust-models }
    authoring: { $ref: "#/sources/authoring/database" }
    destination: { $ref: "#/destinations/rust-generated" }
    inputs:
      main_namespaces:
        [
          reference,
          geography,
          legal,
          official,
          governance,
          politics,
          finance,
          procurement,
          civic,
          accountability,
          source,
          filesystem,
        ]
      operations_namespaces:
        [auth, acquisition, engine, staging, analytics, audit, management]
  rust-sql:
    source: { $ref: "#/sources/packs/project", path: rust-sql }
    authoring: { $ref: "#/sources/authoring/database" }
    destination: { $ref: "#/destinations/rust-sql" }
    inputs:
      main_namespaces:
        [
          reference,
          geography,
          legal,
          official,
          governance,
          politics,
          finance,
          procurement,
          civic,
          accountability,
          source,
          filesystem,
        ]
      operations_namespaces:
        [auth, acquisition, engine, staging, analytics, audit, management]

build:
  cache: reuse
  default_action: generate
