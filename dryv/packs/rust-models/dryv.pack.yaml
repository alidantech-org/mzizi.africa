version: dryv.pack/v1alpha1
key: mzizi.rust-models
source: templates

info:
  title: Mzizi Rust models
  version: 0.2.0
  description: One Rust struct per stored entity of the database foundation plus a deterministic models/mod.rs, emitted into the mzizi-db-generated crate. Consumes the `database` authoring source; field kinds without a Rust/PostgreSQL mapping abort generation.
  purpose: types
  languages: [rust]
  tags: [rust, models, database]

plugins:
  - name: jinja
    extensions: [.j2]

inputs:
  main_namespaces:
    type: string[]
    required: true
    description: Storage namespaces of the `mzizi` database.
  operations_namespaces:
    type: string[]
    required: true
    description: Storage namespaces of the `mzizi_operations` database.

selections:
  entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: each
  all-entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: all

templates:
  model:
    $ref: '#/selections/entities'
    output:
      name: $(subject.name.snake)
      path:
        - $(group.name.snake)
      symbol: $(subject.name.pascal)
  index:
    $ref: '#/selections/all-entities'
  main:
    $ref: '#/selections/all-entities'
  operations:
    $ref: '#/selections/all-entities'
  contract:
    $ref: '#/selections/all-entities'
