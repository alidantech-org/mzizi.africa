version: dryv.pack/v1alpha1
key: mzizi.rust-models
source: templates
info:
  title: Store-scoped Mzizi Rust models
  version: 0.3.0
  description: One row struct per stored entity, one store module and one store verifier. Engine selects the canonical store; templates do not infer placement from namespaces.
  purpose: types
  languages: [rust]
  tags: [rust, models, database]
plugins: [{ name: jinja, extensions: [.j2] }]
capabilities: { persistence: true, stores: true, references: true }
selections:
  entities:
    {
      subject: schema,
      scope: each,
      filter: { all: { role: entity, facet: storage } },
    }
  all-entities:
    {
      subject: schema,
      scope: all,
      filter: { all: { role: entity, facet: storage } },
    }
templates:
  model:
    $ref: "#/selections/entities"
    output:
      destination: rows
      name: $(subject.name.snake)
      path: [$(group.name.snake)]
      symbol: $(subject.name.pascal)
  store:
    $ref: "#/selections/all-entities"
    output: { name: store }
  contract:
    $ref: "#/selections/all-entities"
    output: { name: store_contract }
