version: dryv.pack/v1alpha1
key: mzizi.sdk-ts
package:
  name: { $ref: "#/inputs/package_name" }
  import_root: src
source: templates
info:
  title: Next API Bridge
  version: 0.1.0
  description: Resource action modules, one route registry and nested DTO and enum exports.
  purpose: clients
  summary: Next API Bridge client using the DefyTickets source layout without versions or compatibility shims.
  languages: [typescript]
  frameworks: [nextjs, next-api-bridge]
  tags: [client, server-actions, sdk]
plugins:
  - name: jinja
    extensions: [.j2]
inputs:
  package_name: { type: string, default: next_api_bridge }
selections:
  enums:
    subject: property.enum
    scope: each
  models:
    subject: schema
    scope: each
  model-groups:
    subject: schema
    scope: collects.group
  enum-groups:
    subject: property.enum
    scope: collects.group
  actions:
    subject: operation
    filter:
      all: { facet: http }
    scope: collects.group
  routes:
    subject: operation
    filter:
      all: { facet: http }
    scope: all
templates:
  enum:
    $ref: "#/selections/enums"
    output:
      path: [$(group.name.kebab), enums]
      name: $(subject.name.kebab)
      symbol: $(group.name.pascal)$(subject.name.pascal)
  model:
    $ref: "#/selections/models"
    output:
      path: [$(group.name.kebab), dto]
      name: $(subject.name.kebab)
      symbol: $(group.name.pascal)$(subject.name.pascal)
    imports:
      - $ref: "#/templates/enum"
      - $ref: "#/templates/model"
  dto-index:
    $ref: "#/selections/model-groups"
    output:
      path: [$(group.name.kebab), dto]
  enum-index:
    $ref: "#/selections/enum-groups"
    output:
      path: [$(group.name.kebab), enums]
  resource-index:
    barrel: each
    output:
      path: [$(group.name.kebab)]
    exports:
      - $ref: "#/templates/dto-index"
      - $ref: "#/templates/enum-index"
  action:
    $ref: "#/selections/actions"
    output:
      name: $(group.name.kebab)
    imports:
      - $ref: "#/templates/model"
      - $ref: "#/templates/enum"
  actions-index:
    exports:
      - $ref: "#/templates/action"
  routes:
    $ref: "#/selections/routes"
  types-index:
    exports:
      - $ref: "#/templates/resource-index"
provides:
  schema.types:
    $ref: "#/templates/model"
  property.enum.types:
    $ref: "#/templates/enum"
