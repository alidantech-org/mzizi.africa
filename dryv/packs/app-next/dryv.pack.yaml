version: dryv.pack/v1alpha1
key: mzizi.app-next
source: templates

info:
  title: Next.js App
  version: 0.1.0
  description: Generates Next.js App Router pages from views, with typed API calls for HTTP operations and schema-driven forms and results.
  purpose: frontend
  summary: Next.js App Router pages from views, typed API calls and schema-driven forms.
  languages: [typescript]
  frameworks: [nextjs, react]
  tags: [frontend, pages, app-router, forms]

plugins:
  - name: jinja
    extensions: [.j2]

selections:
  enums:
    subject: property.enum
    scope: each

  models:
    subject: schema
    scope: each

  # Pages can only call operations that are reachable over HTTP.
  operations:
    subject: operation
    filter:
      all: { facet: http }
    scope: each

  # One template per view pattern. A view's role picks the pattern; the library component it imports is the
  # implementation, and its typed props are the whole interface. Other roles fall back to the generic page.
  list_pages:
    subject: view
    filter:
      all: { role: list }
    scope: each

  detail_pages:
    subject: view
    filter:
      all: { role: detail }
    scope: each

  pages:
    subject: view
    filter:
      not: { role: [list, detail] }
    scope: each

  app_views:
    subject: view
    scope: all

  route_pages:
    subject: view
    scope: each

templates:
  # Managed route and navigation data, one file per application.
  routes:
    $ref: '#/selections/app_views'

  # Scaffold-once page at the view's root-level route; it borrows the generated reference page.
  route-page:
    $ref: '#/selections/route_pages'
    output:
      name: $(subject.name.kebab)
      path:
        - $(subject.name.kebab)
      symbol: $(subject.name.pascal)Route

  enum:
    $ref: '#/selections/enums'
    output:
      name: $(subject.name.kebab)
      symbol: $(subject.name.pascal)

  model:
    $ref: '#/selections/models'
    output:
      name: $(subject.name.kebab)
      symbol: $(subject.name.pascal)
    imports:
      - $ref: '#/templates/enum'
      - $ref: '#/templates/model'

  operation:
    $ref: '#/selections/operations'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
      symbol: $(subject.name.camel)
    imports:
      - $ref: '#/templates/model'
      - $ref: '#/templates/enum'

  list-page:
    $ref: '#/selections/list_pages'
    output:
      path:
        - $(group.name.kebab)
        - $(subject.name.kebab)
      symbol: $(subject.name.pascal)Page
    imports:
      - $ref: '#/needs/operation.client'
        transitive: true
      - $ref: '#/templates/operation'

  detail-page:
    $ref: '#/selections/detail_pages'
    output:
      path:
        - $(group.name.kebab)
        - $(subject.name.kebab)
      symbol: $(subject.name.pascal)Page
    imports:
      - $ref: '#/needs/operation.client'
      - $ref: '#/templates/operation'

  page:
    $ref: '#/selections/pages'
    output:
      path:
        - $(group.name.kebab)
        - $(subject.name.kebab)
      symbol: $(subject.name.pascal)Page
    imports:
      - $ref: '#/needs/operation.client'
      - $ref: '#/templates/operation'
      - $ref: '#/templates/model'

# Pages call operations through whichever pack the project binds here (for example
# clients/next-api-bridge). Unbound, they use this pack's own fetch-based calls.
needs:
  operation.client: { required: false }

inputs:
  port:
    type: string
    default: "3000"
    description: Port of the development and production server.
  sdk_package:
    type: string
    default: "@mzizi/api-client"
    description: Name of the TypeScript API SDK package the app imports.
  sdk_path:
    type: string
    default: ../sdk/api-ts
    description: Path from the app to the SDK package, used as a file dependency.
  ui_package:
    type: string
    default: "@mzizi/ui-web"
    description: Name of the hand-written web component package the pattern templates import.
  page_size:
    type: string
    default: "20"
    description: Rows a list page asks for at first; the operation's own maximum still applies.
  workspace_root:
    type: string
    default: ..
    description: Path from the app to the folder both the app and the SDK sit in (the bundler root).
