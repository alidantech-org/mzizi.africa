version: dryv.pack/v1alpha1
key: mzizi.use-cases
source: templates

info:
  title: Mzizi use cases
  version: 0.4.0
  description: Scaffolds, per feature, the implementation of the generated NestJS service contract and one injectable use case per HTTP operation. Scaffolds are created once and then owned by the project.
  purpose: backend
  languages: [typescript]
  frameworks: [nestjs]
  tags: [use-cases, services, scaffold]

plugins:
  - name: jinja
    extensions: [.j2]

needs:
  schema.validation: { required: true }
  # Entities behind each operation's response read projection, for CRUD starting points.
  schema.persistence: { required: true }
  # Each entity's generated query options (the type-files pack's config).
  schema.types: { required: true }

selections:
  entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: each

  operations:
    subject: operation
    filter:
      all: { facet: http }
    scope: each

  features:
    subject: operation
    filter:
      all: { facet: http }
    scope: collects.feature

# <group>/features/<feature>/use-cases/<operation>.usecase.ts (the service file holds the implementation).
templates:
  usecase:
    $ref: '#/selections/operations'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
        - features
        - $(feature.name.kebab)
      symbol: $(subject.name.pascal)UseCase
    imports:
      - $ref: '#/templates/repository'
        members: true
      # Transitive: nested read-projection DTOs, not only the response DTO itself.
      - $ref: '#/needs/schema.validation'
        transitive: true
      - $ref: '#/needs/schema.persistence'
        transitive: true

  # database/base/*: the Defytickets base repository (copied), its query types and the helpers of the generated named queries.
  base-repository:
    output:
      destination: app

  # <group>/schema/repositories/<entity>.repository.ts: one repository per stored entity.
  entity-repository:
    $ref: '#/selections/entities'
    output:
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
        - schema
      symbol: $(subject.name.pascal)Repository
    imports:
      - $ref: '#/needs/schema.persistence'
        transitive: true
      - $ref: '#/needs/schema.types'
        transitive: true

  # Authored related selections are complete; generic expansion caps do not silently truncate screen documents.
  # <feature>/<feature>.repository.ts: one method per declared read query of the feature.
  repository:
    $ref: '#/selections/features'
    output:
      name: $(feature.name.kebab)
      path:
        - $(group.name.kebab)
        - features
        - $(feature.name.kebab)
      symbol: $(group.name.pascal)$(feature.name.pascal)Repository
    imports:
      - $ref: '#/templates/entity-repository'
        transitive: true
      - $ref: '#/needs/schema.persistence'
        transitive: true
      - $ref: '#/needs/schema.types'
        transitive: true

  # use-cases/<operation>.usecase.spec.ts: scaffolded once with the contract's promises as todos.
  usecase-spec:
    $ref: '#/selections/operations'
    output:
      destination: test
      name: $(subject.name.kebab)
      path:
        - $(group.name.kebab)
        - features
        - $(feature.name.kebab)
    imports:
      - $ref: '#/templates/usecase'
        members: true

provides:
  operation.usecase:
    $ref: '#/templates/usecase'
  module.provider:
    $ref: '#/templates/repository'
