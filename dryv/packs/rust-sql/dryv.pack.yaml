version: dryv.pack/v1alpha1
key: mzizi.rust-sql
source: templates

info:
  title: Mzizi SQL snapshots
  version: 0.2.0
  description: Deterministic PostgreSQL DDL for the database foundation, one complete schema snapshot per target database (main.sql, operations.sql). `mzizi-db assemble` turns a snapshot into the immutable checksummed release stream under migrations/. Consumes the `database` authoring source.
  purpose: persistence
  languages: [sql]
  tags: [sql, postgresql, migrations, database]

plugins:
  - name: jinja
    extensions: [.j2]

# The namespace-to-database lists mirror dryv/contracts/apps/database/persistence.ts (the canonical
# catalogue); `bun run database:assignments` fails on drift.
inputs:
  main_namespaces:
    type: string[]
    required: true
    description: Storage namespaces that belong to the `mzizi` database.
  operations_namespaces:
    type: string[]
    required: true
    description: Storage namespaces that belong to the `mzizi_operations` database.

# Boundary rules enforced inside the templates (a violation aborts generation with a message):
# - every entity storage namespace must be listed in exactly one of the two inputs;
# - a relation whose source and target namespaces map to different databases is rejected
#   (cross-database relationships are typed identifiers, never foreign keys);
# - field kinds without a PostgreSQL mapping (arrays, records, composites, unions, tuples,
#   generics, literals, nested schemas) are rejected;
# - output is deterministic: namespaces follow the input order, tables follow the engine's schema order.
selections:
  entities:
    subject: schema
    filter:
      all: { role: entity }
    scope: all

templates:
  main:
    $ref: '#/selections/entities'
  operations:
    $ref: '#/selections/entities'
