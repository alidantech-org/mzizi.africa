version: dryv.pack/v1alpha1
key: mzizi.rust-sql
source: templates
info:
  title: Store-scoped Mzizi SQL snapshots
  version: 0.3.0
  description: Complete PostgreSQL schema snapshot for the selected canonical store. Existing mzizi-db assembly and immutable releases remain separate from generation.
  purpose: persistence
  languages: [sql]
  tags: [sql, postgresql, database]
plugins: [{ name: jinja, extensions: [.j2] }]
capabilities: { persistence: true, stores: true, references: true }
selections:
  entities:
    {
      subject: schema,
      scope: all,
      filter: { all: { role: entity, facet: storage } },
    }
templates:
  snapshot: { $ref: "#/selections/entities", output: { name: schema } }
