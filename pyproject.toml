# Python workspace root (uv). Members: the reusable packages under source/packages and the engine under source/backend/engine.
# Install everything reproducibly with `uv sync --all-packages` (writes .venv, resolves from uv.lock). Run tools with `uv run`.
# Tooling choice: uv was already installed in the environment and the old engine used pyproject/setuptools; uv adds one lock for all members.
[project]
name = "mzizi-workspace"
version = "0.0.0"
description = "Workspace root for the Mzizi Python packages and engine (not published)."
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["source/packages/*", "source/backend/engine"]

[dependency-groups]
dev = [
    "boto3-stubs>=1.44.0",
    "lxml-stubs>=0.5.1",
    "mypy>=2.4.1",
    "pytest",
    "pytest-asyncio",
    "ruff>=0.17.4",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20261111",
    "types-shapely>=2.1.0.20261030",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The archive under .docs is historical and must never be collected or executed.
testpaths = ["source"]
norecursedirs = [".docs", ".venv", "node_modules", "seed"]
asyncio_default_fixture_loop_scope = "function"

# ── Code quality (run from the root: `bun run format`, `bun run lint`, `bun run typecheck`) ──
# One configuration for every workspace member; members do not carry their own.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".docs", "seed", "node_modules", "source/apps", "source/backend/api", "dryv"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I import order, UP modern syntax, B bugbear, SIM simplifications, RUF ruff rules.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# E501: the formatter owns line length; long strings and SQL are left intact.
# UP042: `(str, Enum)` members are compared and serialized as plain strings; StrEnum would change their formatting.
ignore = ["E501", "UP042"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header", "mzizi_engine.auth.require"]

[tool.ruff.lint.per-file-ignores]
# Tests may assert on any exception, use short names and inline lambdas.
"**/tests/**" = ["B017", "E731", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["mzizi_engine", "mzizi_extraction", "mzizi_filesystem", "mzizi_manifest", "mzizi_scraping", "mzizi_fetch"]

[tool.mypy]
python_version = "3.12"
# Sources only: tests are covered by ruff and pytest. Rules: .docs/rules/typed-code.md
files = ["source/packages/*/src", "source/backend/engine/src", "scripts"]
namespace_packages = true
explicit_package_bases = false
strict = true
plugins = ["pydantic.mypy"]
# No Any, no bare dict/list as contracts. Untyped data lives only in parse modules.
disallow_any_explicit = true
disallow_any_generics = true
warn_unreachable = true
pretty = true
show_error_codes = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
# Published without type information.
module = ["pypdfium2.*", "pdfplumber.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Legacy modules not yet moved to typed contracts. This list may only shrink: each package leaves it
# when its consolidation task lands (TSK-443D558BBB70 manifest, TSK-401E2BBBF98F engine). `mzizi_filesystem.*`
# left this list when its database code moved to `mzizi_engine.filesystem` (TSK-E55B1BC4011A); that module's own
# raw-SQL business logic (repository, service, sync, uploads, reset, transitions, lineage, livecheck, download, cli)
# is still legacy and is the remaining, larger part of that task: typed row contracts instead of `dict`, and
# splitting modules over ~400 lines.
module = ["mzizi_manifest.*", "mzizi_engine", "mzizi_engine.app", "mzizi_engine.auth", "mzizi_engine.capabilities", "mzizi_engine.cli", "mzizi_engine.config", "mzizi_engine.database_store", "mzizi_engine.executor", "mzizi_engine.filesystem.*", "mzizi_engine.filesystem_api.*", "mzizi_engine.store"]
disallow_any_explicit = false
disallow_any_generics = false
disallow_any_decorated = false
warn_return_any = false

[[tool.mypy.overrides]]
# The one declared parsing boundary for database rows (.docs/rules/typed-code.md): a row's shape depends on
# whatever query ran, so `Any` is deliberate here and nowhere past it.
module = ["mzizi_engine.ports.database"]
disallow_any_explicit = false
warn_return_any = false

[[tool.mypy.overrides]]
# boto3 ships no type information here (no `mypy-boto3-s3` stub package installed); the S3 client and its
# responses are therefore a declared `Any` boundary, same reasoning as the database port above. Everything this
# module returns to its own callers (ObjectHead, str, bytes, BinaryIO, list[dict[str, object]]) is fully typed.
module = ["mzizi_filesystem.store"]
disallow_any_explicit = false
warn_return_any = false
