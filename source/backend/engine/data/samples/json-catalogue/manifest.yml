schema: mzizi.site/v1
site: example/open-data
fetch: { mode: api }
modules: [datasets]
tags: [purpose:data-portal, platform:ckan]
policy:
  assessment: { ref: assess-example-open-data }
  licence: { ref: cc-by-4.0, source: "https://example.org/terms" }
  scope:
    hosts: [data.example.org]
    schemes: [https]
    paths: { allow: [/api/] }
  rate: { requests_per_second: 1, max_concurrency: 2 }
  retries: { max: 2, backoff: exponential_jitter }
  limits: { max_response_bytes: 10485760, timeout_seconds: 30 }
  identify: { user_agent: "MziziBot/1.0 (+https://mzizi.africa/bot; contact@mzizi.africa)" }
  robots: respect
  auth: none
  stop_on: ["401", "403", "429", repeated_5xx]
  purposes: [research, public_atlas]
