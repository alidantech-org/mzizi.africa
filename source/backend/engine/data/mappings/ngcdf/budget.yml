mapping: budget
extractor: ngcdf-api
target_kind: finance.budgets
key: [unitId, fiscalYearId, programCode, kind]
fields:
  unitId:         { from: unitCode, transform: [{ ref: { kind: finance.units, field: code } }] }
  fiscalYearId:   { from: fiscalYearCode, transform: [{ ref: { kind: finance.years, field: code } }] }
  programCode:    { const: ngcdf-allocation }
  kind:           { const: original }
  approvedAmount: { from: amount, transform: decimal }
  currencyCode:   { const: KES }
provenance:
  locator: { row: $row }
  method: extracted
