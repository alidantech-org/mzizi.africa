mapping: unit-adm1
extractor: geojson
target_kind: geography.units
key: [code]
fields:
  code:           { from: shapeName, transform: { slug_code: "${jurisdiction}/" } }
  name:           { from: shapeName, transform: collapse_whitespace }
  kind:           { const: territorial }
  isActive:       { const: true }
  jurisdictionId: { const: { $ref: { kind: reference.jurisdictions, where: { code: "${jurisdiction}" } } } }
  levelId:        { const: { $ref: { kind: reference.classifications, where: { code: "geography/level/${adm1_level}", jurisdictionId: { $ref: { kind: reference.jurisdictions, where: { code: "${jurisdiction}" } } } } } } }
  parentId:       { const: { $ref: { kind: geography.units, where: { code: "${jurisdiction}" } } } }
provenance:
  locator: { feature: $feature }
  method: extracted
