mapping: boundary-adm1
extractor: geojson
target_kind: geography.boundaries
key: [unitId]
fields:
  unitId:        { from: shapeName, transform: [{ slug_code: "${jurisdiction}/" }, { ref: { kind: geography.units, field: code } }] }
  geometry:      { from: geometry }
  referenceYear: { const: "${reference_year}" }
provenance:
  locator: { feature: $feature }
  method: extracted
