mapping: unit-adm0
extractor: geojson
target_kind: geography.units
key: [code]
fields:
  code:           { const: ke }
  name:           { from: shapeName, transform: collapse_whitespace }
  kind:           { const: territorial }
  isActive:       { const: true }
  jurisdictionId: { const: { $ref: { kind: reference.jurisdictions, where: { code: ke } } } }
  levelId:        { const: { $ref: { kind: reference.classifications, where: { code: geography/level/country } } } }
provenance:
  locator: { feature: $feature }
  method: extracted
