mapping: boundary-adm0
extractor: geojson
target_kind: geography.boundaries
key: [unitId]
fields:
  unitId:        { const: { $ref: { kind: geography.units, where: { code: "${jurisdiction}" } } } }
  geometry:      { from: geometry }
  referenceYear: { const: "${reference_year}" }
provenance:
  locator: { feature: $feature }
  method: extracted
