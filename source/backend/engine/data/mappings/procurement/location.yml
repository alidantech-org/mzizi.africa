mapping: location
extractor: tenders-pe
target_kind: organization.locations
key: [entityId]
fields:
  entityId:    { from: entityCode, transform: [{ ref: { kind: organization.entities, field: code } }] }
  geoUnitId:   { from: geoUnitCode, transform: [{ ref: { kind: geography.units, field: code } }] }
  addressText: { from: addressText }
provenance:
  locator: { id: $id }
  method: extracted
