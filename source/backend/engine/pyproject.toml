[project]
name = "mzizi-engine"
version = "0.1.0"
description = "Mzizi Python orchestration engine: operational API, job/run lifecycle, workers, event stream and callback outbox. Orchestrates the packages; never writes domain schemas."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic>=2.7",
  "uvicorn",
  "httpx",
  "pyjwt[crypto]",
  "pyyaml",
  "psycopg[binary]",
  "mzizi-filesystem",
  "mzizi-database-client",
  "mzizi-manifest",
  "mzizi-scraping",
  "mzizi-fetch",
  "mzizi-extraction",
  "typer>=0.29.1",
  "rich>=15.0.0",
  "questionary>=2.1.1",
  "tldextract>=5.4.0",
]

[project.scripts]
mzizi-engine = "mzizi_engine.cli:main"
mzizi = "mzizi_engine.devcli.app:main"

[project.optional-dependencies]
browser = [
    "patchright>=1.64.4",
    "playwright>=1.65.1",
]
services = [
    "fastembed>=0.9.1",
    "pymongo>=4.20.0",
    "qdrant-client>=1.20.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
mzizi-filesystem = { workspace = true }
mzizi-database-client = { workspace = true }
mzizi-manifest = { workspace = true }
mzizi-scraping = { workspace = true }
mzizi-fetch = { workspace = true }
mzizi-extraction = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
