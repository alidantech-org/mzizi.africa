[project]
name = "mzizi-engine"
version = "0.1.0"
description = "Mzizi Python orchestration engine: operational API, job/run lifecycle, workers, event stream and callback outbox. Orchestrates the packages; never writes domain schemas."
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic>=2.7",
  "uvicorn",
  "httpx",
  "pyjwt[crypto]",
  "pyyaml",
  "pymongo>=4.20.0",
  "psycopg[binary]",
  "mzizi-filesystem",
  "mzizi-manifest",
  "mzizi-patterns",
  "mzizi-translation",
  "mzizi-fetch",
  "mzizi-search",
  "mzizi-crawler",
  "mzizi-browser",
  "mzizi-extraction",
  "redis>=6,<8",
]

[project.scripts]
mzizi-engine = "mzizi_engine.cli.main:main"

[project.optional-dependencies]
browser = ["mzizi-browser[browser]"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
mzizi-filesystem = { workspace = true }
mzizi-manifest = { workspace = true }
mzizi-patterns = { workspace = true }
mzizi-translation = { workspace = true }
mzizi-fetch = { workspace = true }
mzizi-search = { workspace = true }
mzizi-crawler = { workspace = true }
mzizi-browser = { workspace = true }
mzizi-extraction = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
