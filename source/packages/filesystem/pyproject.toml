[project]
name = "mzizi-filesystem"
version = "0.1.0"
description = "Reusable filesystem capability: S3 object access, hashing, deduplication, artifact metadata and seed publication to a registry."
requires-python = ">=3.12"
dependencies = ["boto3", "pyyaml", "mzizi-manifest"]

[project.scripts]
mzizi-publish-seed = "mzizi_filesystem.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
mzizi-manifest = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
