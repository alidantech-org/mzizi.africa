[project]
name = "mzizi-filesystem"
version = "0.1.0"
description = "Reusable filesystem capability: S3 object access, hashing, deduplication, key and code naming and the media catalog. No database knowledge; the engine owns metadata storage."
requires-python = ">=3.12"
dependencies = ["boto3", "pyyaml", "jsonschema", "mzizi-manifest", "pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
mzizi-manifest = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
