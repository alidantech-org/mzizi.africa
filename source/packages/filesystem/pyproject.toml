[project]
name = "mzizi-filesystem"
version = "0.1.0"
description = "Filesystem capability: versioned files at caller-chosen placements, S3 object access, keys, lineage, relocation, uploads and directory sync behind one orchestrator. No database knowledge."
requires-python = ">=3.12"
dependencies = ["boto3", "pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.uv.sources]
mzizi-manifest = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
