[project]
name = "mzizi-patterns"
version = "0.1.0"
description = "Tokenisation, term matching, evidence ranking and near-duplicate detection driven by term lists and profiles. Knows no publisher, language or database."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
