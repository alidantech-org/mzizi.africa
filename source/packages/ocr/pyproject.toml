[project]
name = "mzizi-ocr"
version = "0.1.0"
description = "Reusable OCR through the system Tesseract, with engine/version/confidence reporting."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
