[project]
name = "mzizi-cli"
version = "0.1.0"
description = "The developer command line for Mzizi: command catalog, prompts, runs and terminal output over a typed engine gateway. Never imports the engine."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "rich>=15.0.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
