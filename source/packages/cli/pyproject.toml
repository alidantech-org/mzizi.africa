[project]
name = "mzizi-cli"
version = "0.1.0"
description = "The Mzizi developer command line: a front door that builds the engine runtime and calls its operations on local files and URLs."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7", "rich>=15.0.0", "typer>=0.29.1", "questionary>=2.1.1", "mzizi-engine", "mzizi-crawler", "mzizi-browser", "mzizi-extraction", "mzizi-fetch"]

[project.scripts]
mzizi = "mzizi_cli.orchestrator.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
mzizi-engine = { workspace = true }
mzizi-crawler = { workspace = true }
mzizi-browser = { workspace = true }
mzizi-extraction = { workspace = true }
mzizi-fetch = { workspace = true }
