[project]
name = "mzizi-database"
version = "0.1.0"
description = "Reusable database primitives: safe connections, transactions, SQL migration application and verified reset of the disposable rewrite database."
requires-python = ">=3.12"
dependencies = ["psycopg[binary]", "pyyaml"]

[project.scripts]
mzizi-db = "mzizi_database.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
