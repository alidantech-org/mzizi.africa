[project]
name = "mzizi-source"
version = "0.1.0"
description = "Reusable source client: polite identified HTTP/API fetching, rate limits, challenge detection and the collection-gate decision rule."
requires-python = ">=3.12"
dependencies = ["httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
