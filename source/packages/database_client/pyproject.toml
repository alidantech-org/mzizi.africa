[project]
name = "mzizi-database-client"
version = "0.1.0"
description = "Typed async HTTP client for the Rust database service's named operations. Knows HTTP and JSON only; never a database connection string."
requires-python = ">=3.12"
dependencies = ["httpx", "pydantic>=2.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
