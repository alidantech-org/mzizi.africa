[project]
name = "mzizi-scraping"
version = "0.1.0"
description = "Reusable HTML/JSON scraping: selectors, field extraction, transforms and link discovery (no source-specific logic)."
requires-python = ">=3.12"
dependencies = ["beautifulsoup4", "lxml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
