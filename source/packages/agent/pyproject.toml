[project]
name = "mzizi-agent"
version = "0.1.0"
description = "Reusable agent support: provider-neutral model interface, tool registry and attributable proposals that are never canonical truth."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
