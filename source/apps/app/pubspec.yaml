name: mzizi_app
description: "Mzizi App app generated by Dryv."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  intl: ^0.20.3
  material_ui: ^1.11.1
  go_router: ^14.8.1
  internet_connection_checker_plus: ^2.7.1
  geolocator: ^13.0.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  shared_preferences: ^2.5.3
  flutter_api_bridge: ^0.2.0
  # The shared generated API client SDK (app.flutter binds it through operation.client).
  mzizi_api:
    path: ../../sdk/api-dart
  # The hand-written components the pattern screens import.
  mzizi_ui:
    path: ../../sdk/ui/flutter
  flutter_svg: ^2.4.0
  google_fonts: ^9.0.0
  flutter_markdown_plus: ^1.0.12
  fl_chart: ^1.3.1
  flutter_map_marker_cluster: ^8.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.1

flutter:
  uses-material-design: true