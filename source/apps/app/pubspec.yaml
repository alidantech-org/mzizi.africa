name: mzizi_app
description: "Mzizi App app generated by Dryv."
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  material_ui: ^1.11.1
  go_router: ^14.8.1
  internet_connection_checker_plus: ^2.7.1
  flutter_api_bridge: ^0.2.0
  # The shared generated API client SDK (app.flutter binds it through operation.client).
  mzizi_api:
    path: ../../sdk/api-dart

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.1.1

flutter:
  uses-material-design: true