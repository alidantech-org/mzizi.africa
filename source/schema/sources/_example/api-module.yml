# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/sources/module.schema.json
module: countries
mapping: global.reference.countries.example-statistics
discover:
  endpoint: { name: countries }
extract:
  fields:
    code: { from: { jsonpath: "$.iso2" } }
    name: { from: { jsonpath: "$.name" } }
expect: { min_items: 1, required_fields: [code, name] }
