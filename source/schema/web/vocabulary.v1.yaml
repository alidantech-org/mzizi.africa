# Web vocabulary v1: classification data for URL kinds, tracking parameters, challenge markers and file signatures.
# Read by mzizi-fetch (mzizi_fetch.web.vocabulary); shape: vocabulary.schema.json. Extend here, not in code.
version: 1
url_kinds:
  image: [png, jpg, jpeg, gif, webp, svg, bmp, ico, tif, tiff, avif]
  media: [mp3, mp4, m4a, wav, ogg, webm, mov, avi, mkv, flac]
  document: [pdf, doc, docx, xls, xlsx, ppt, pptx, odt, ods, odp, rtf, txt, csv, tsv, epub]
  data: [json, xml, geojson, kml, kmz, shp, parquet, sql]
  archive: [zip, gz, tgz, tar, rar, 7z, bz2, iso]
  program: [exe, msi, dmg, apk]
media_tags: [video, audio, track]
embed_tags: [embed, object, iframe]
tabular_extensions: [csv, tsv, xls, xlsx, ods]
captcha_page_max_links: 8
captcha_blocking_statuses: [401, 403, 429, 503]
spa_root_selectors: ["#root", "#app", "#__next", "#__nuxt", "#___gatsby", "app-root", "[ng-version]", "[data-reactroot]"]
busy_selectors: ["[aria-busy=true]", "[aria-busy='true']", "[role=progressbar]", "[data-loading=true]", ".loading", ".loader", ".spinner", ".preloader", ".skeleton", "#loader", "#loading", "#preloader", "#nprogress", "[class*=spinner]", "[class*=skeleton]", "[class*=preloader]", "[class*=loading]"]
pagination:
  next: [next, next page, next >, older, older posts, older entries, forward, "»", "›", "→", ">", ifuatayo, mbele, suivant, siguiente, weiter]
  previous: [previous, prev, previous page, newer, back, "«", "‹", "←", "<", iliyotangulia, précédent, anterior]
  last: [last, last page, end, mwisho, dernier, último]
  load_more: [load more, show more, view more, see more, more results, more items, more posts, pakia zaidi, onyesha zaidi, voir plus, ver más]
  container_words: [pagination, pager, paginate, paging, page-numbers, page-nav, pagenav, pages]
  disabled_words: [disabled, inactive, unavailable]
  carousel_words: [carousel, slider, slick, swiper, owl-, splide, glide, flickity, slideshow, ticker, marquee]
  infinite_scroll_words: [infinite-scroll, infinitescroll, infinite_scroll, endless, lazy-load-more]
download_hints:
  path_words: [download, downloads, attachment, attachments, getfile, get-file, filemanager, wp-content/uploads, sites/default/files, uploads, docs, documents, publications]
  query_keys: [download, file, fileid, file_id, filename, attachment, attachment_id, document, docid, doc_id, fid]
  anchor_words: [download, pdf, get file, view document, open document, annual report, tender document, gazette]
cms_media_paths: ["/wp-json/wp/v2/media?per_page=100&page={n}"]
noise_hosts: [google-analytics.com, googletagmanager.com, doubleclick.net, googlesyndication.com, facebook.net, connect.facebook.net, platform.twitter.com, syndication.twitter.com, hotjar.com, addthis.com, sharethis.com, clarity.ms, tawk.to, crisp.chat, intercom.io, linkedin.com/px, tiktok.com/i18n]
needs_javascript_phrases: [enable javascript, javascript is required, javascript must be enabled, requires javascript, you need to enable javascript, please turn on javascript, this app works best with javascript]
generic_file_stems: [download, downloads, file, files, attachment, view, get, index, default, document, doc, image, img, photo, pic, upload, uploads, open, content]
tracking_parameters: [utm_source, utm_medium, utm_campaign, utm_term, utm_content, fbclid, gclid, mc_cid, mc_eid]
challenge_markers:
  captcha: [captcha, g-recaptcha, h-captcha, cf-turnstile]
  challenge: [cf-chl, "just a moment...", checking your browser, verify you are human, "attention required! | cloudflare"]
  notice: [access denied, request blocked, you have been blocked, unusual traffic]
file_signatures:
  - {magic: "%PDF", name: pdf, group: document}
  - {magic: "\u0089PNG", name: png, group: image}
  - {magic: "ÿØÿ", name: jpg, group: image}
  - {magic: "GIF8", name: gif, group: image}
  - {magic: "PK\u0003\u0004", name: zip, group: archive}
  - {magic: "\u001f\u008b", name: gzip, group: archive}
  - {magic: "Rar!", name: rar, group: archive}
  - {magic: "MZ", name: windows-executable, group: executable}
  - {magic: "\u007fELF", name: elf-executable, group: executable}
  - {magic: "#!", name: script, group: executable}
  - {magic: "<!doc", name: html, group: web, text: true}
  - {magic: "<html", name: html, group: web, text: true}
zip_based_extensions: [docx, xlsx, pptx, odt, ods, odp, epub, apk, jar, zip]
jpeg_extensions: [jpg, jpeg]
risky_groups: [executable, archive]
block_responses:
  connection: retry
  dns: skip
  timeout: retry
  http_401: human_review
  http_403: skip
  http_404: skip
  http_429: back_off
  http_5xx: back_off
  captcha: human_review
  challenge: human_review
  block_notice: pause
