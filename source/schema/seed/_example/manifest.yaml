# yaml-language-server: $schema=https://res.alidantech.org/mzizi/public/schemas/seed/manifest.schema.json
# Example seed manifest: it registers files; it never loads data. A CSV's table comes from its path.
release: 2026-11-16.1
bucket: mzizi
region: us-east-1
logical_root: /seed
root_code: seed
defaults: { versioning: versioned, pin: true }
entries:
  - id: data.global.reference
    glob: data/global/reference/*.csv
    media_type: text/csv
    origin: Prepared by hand from the published classification list.
  - id: data.ke.governance
    glob: data/ke/governance/*.csv
    media_type: text/csv
    depends_on: [data.global.reference]
  - id: sources.ke.example-ministry
    glob: sources/ke/example-ministry/**
    depends_on: [data.global.reference]
