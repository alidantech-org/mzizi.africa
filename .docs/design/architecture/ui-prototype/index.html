<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="views.css">
<script>
/* Paint-first theme: set mode and palette from the cookie before first paint, as the real shell does. */
(function(){try{var m=document.cookie.match(/mzizi-proto-theme=([^;]*)/)||[];var v=decodeURIComponent(m[1]||localStorage.getItem('mzizi-proto-theme')||'system.terra').split('.');
var mode=v[0]==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):v[0];
document.documentElement.dataset.mode=mode;document.documentElement.dataset.palette=v[1]||'terra';}catch(e){}})();
</script>
</head>
