/* Paint-first theme: set mode and palette from the cookie before first paint, as the real shell does. */
(function(){try{var m=document.cookie.match(/mzizi-proto-theme=([^;]*)/)||[];var v=decodeURIComponent(m[1]||localStorage.getItem('mzizi-proto-theme')||'system.terra').split('.');
var mode=v[0]==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):v[0];
document.documentElement.dataset.mode=mode;document.documentElement.dataset.palette=v[1]||'terra';
if(v[2]){var s=document.documentElement.style;s.setProperty('--accent','#'+v[2]);s.setProperty('--accent-soft','color-mix(in srgb,#'+v[2]+' 16%,var(--surface))');}
var am=document.cookie.match(/mzizi-proto-a11y=([^;]*)/)||[];var a=decodeURIComponent(am[1]||localStorage.getItem('mzizi-proto-a11y')||'m.on.c.m.n').split('.');var d=document.documentElement.dataset;d.size=a[0]||'m';d.motion=a[1]||'on';d.density=a[2]||'c';d.radius=a[3]||'m';d.contrast=a[4]||'n';d.reading=a[5]||'s';var sm=document.cookie.match(/mzizi-proto-side=([^;]*)/)||[];d.side=(decodeURIComponent(sm[1]||localStorage.getItem('mzizi-proto-side')||'open').split('.')[0])||'open';}catch(e){}})();
</script>
