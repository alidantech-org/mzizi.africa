# Proposed profile (code sys.eng.docs.profile): how term matches become kinds, subjects and an impact level.
# The group a tag reads from decides whether it is a kind (what a document is) or a subject (what it is about).
# Impact: 3 high, 2 medium, 1 low, 0 noise. Weights are starting values to calibrate on reviewed decisions.
code: sys.eng.docs.profile
term_lists: [sys.trm.ke.documents]  # extends sys.trm.global.documents
stopword_group: stopwords
tags:
  - { tag: law, schemas: [legal], group: law, impact: 3, weight: 1.0 }
  - { tag: register, schemas: [official, politics], group: register, impact: 3, weight: 1.2 }
  - { tag: notice, schemas: [official, governance], group: notice, impact: 3, weight: 1.0 }
  - { tag: procurement, schemas: [civic, official], group: procurement, impact: 3, weight: 1.2 }
  - { tag: court, schemas: [legal], group: court, impact: 3, weight: 1.0 }
  - { tag: report, schemas: [finance, civic], group: report, impact: 2, weight: 1.0 }
  - { tag: form, group: form, impact: 1, weight: 1.0 }
  - { tag: news, group: news, impact: 1, weight: 1.0 }
  - { tag: noise, group: noise, impact: 0, weight: 1.5 }
  - { tag: funding, schemas: [finance, official], group: funding, impact: 3, weight: 1.2 }
  - { tag: audit-budget, schemas: [finance], group: audit-budget, impact: 3, weight: 1.2 }
  - { tag: people-places, schemas: [official, geography, governance], group: people-places, impact: 2, weight: 0.8 }
